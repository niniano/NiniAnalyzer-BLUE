# NiniAnalyzer Public (BLUE) · Windows 설치 파일 자동 빌드
# - GitHub 「Releases」에서 릴리스를 Publish 하면: Windows에서 빌드 → 설치 파일 · ZIP · SHA256 을 그 릴리스에 자동 첨부
# - Actions 탭 「Run workflow」: 빌드만 해서 Artifacts 로 받기 (릴리스에는 안 올림)
# - 릴리스 설명을 비워 두고 Publish 하면 README_<버전>.md (예: README_1_0_9.md) 로 설명을 바로 채움 (직접 쓴 설명은 그대로 둠)
# - 설치 파일이 붙으면 디스코드 고정 「다운로드」 임베드를 바로 새 버전으로 고침 (NiniTools 저장소의 같은 스크립트 사용)
#   필요: 이 저장소 Settings → Secrets and variables → Actions 에 NiniTools 와 같은 값
#         Secret DISCORD_DOWNLOAD_WEBHOOK · Variable DOWNLOAD_MESSAGE_ID  (없으면 건너뜀 · NiniTools 4시간 주기 실행 때 반영)
# 릴리스 태그는 v + 소스의 버전(build_public_windows.py VERSION)과 같아야 함 (예: v1.0.9)
name: Build BLUE installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version check
        id: ver
        run: |
          $v = (Select-String -Path build_public_windows.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Source version: $v"
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            if ($tag -ne "v$v") { throw "Release tag $tag does not match source version v$v" }
          }

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          choco install innosetup -y --no-progress
          $lang = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Korean.isl"
          if (-not (Test-Path $lang)) {
            Write-Host "Korean.isl missing -> downloading from Inno Setup translations"
            foreach ($u in @("https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl",
                             "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Korean.isl")) {
              try { Invoke-WebRequest -Uri $u -OutFile $lang; break } catch { Write-Host "not found: $u" }
            }
            if (-not (Test-Path $lang)) { throw "Korean.isl not available" }
          }

      - name: Release checks (same as Build_Public_EXE.cmd)
        run: |
          python verify_release.py
          if ($LASTEXITCODE) { exit 1 }
          $tests = @(
            "test_public_no_drive_leak.py", "test_public_stage2_4_release.py", "test_public_stage2_5_rc3.py",
            "test_public_rc4_fixes.py", "test_public_rc4_2_feign_recheck.py", "test_public_rc4_3_class_color.py",
            "test_public_rc4_4_fonts.py", "test_public_rc5_layout.py", "test_public_rc5_3.py", "test_public_rc5_3_1.py",
            "test_public_rc5_4*.py", "test_public_rc5_5*.py", "test_public_rc5_6*.py", "test_public_1_0_1*.py", "test_public_1_0_2*.py", "test_public_1_0_3*.py", "test_public_1_0_5*.py", "test_public_1_0_6*.py", "test_public_1_0_7*.py", "test_public_1_0_8*.py", "test_public_1_0_9*.py", "test_nini_stage2_2_1_gui_regression.py",
            "test_b37_5_0_step4_3_live_try_wheel.py", "test_b37_5_0_5_try_wheel_focus_regression.py")
          foreach ($t in $tests) {
            python -m unittest discover -s qa -p $t
            if ($LASTEXITCODE) { Write-Host "::error::QA failed: $t"; exit 1 }
          }

      - name: Build EXE folder + ZIP
        run: |
          python build_public_windows.py
          if ($LASTEXITCODE) { exit 1 }
          python package_public_release.py
          if ($LASTEXITCODE) { exit 1 }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "installer\NiniAnalyzer_Public.iss"
          if ($LASTEXITCODE) { exit 1 }
          $f = "dist\NiniAnalyzer_Public_${{ steps.ver.outputs.version }}_Setup_Windows_x64.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii ($f + ".sha256.txt") ($h + " *" + (Split-Path $f -Leaf))
          Write-Host "SETUP SHA256: $h"

      - name: Keep build files (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NiniAnalyzer_Public_${{ steps.ver.outputs.version }}
          path: |
            dist/*_Setup_Windows_x64.exe
            dist/*_Setup_Windows_x64.exe.sha256.txt
            dist/*_SAFE_FOLDER.zip
            dist/*_SAFE_FOLDER.zip.sha256.txt

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist\*_Setup_Windows_x64.exe, dist\*_Setup_Windows_x64.exe.sha256.txt, dist\*_SAFE_FOLDER.zip, dist\*_SAFE_FOLDER.zip.sha256.txt).FullName --clobber

  notes:
    # 릴리스 설명 자동 채우기 (빌드와 따로 · 몇 초 안에 끝남)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Fill release notes from README_<version>.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "릴리스 설명이 이미 있어서 그대로 둠"; exit 0
          fi
          v=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' build_public_windows.py | head -1)
          f="README_${v//./_}.md"
          if [ ! -f "$f" ]; then echo "::warning::$f 가 없어 릴리스 설명을 채우지 않음"; exit 0; fi
          # 첫 줄 「# NiniAnalyzer_Public x.y.z」 는 릴리스 제목과 겹치므로 뺌
          sed '1{/^# /d}' "$f" | sed '1{/^$/d}' > release_notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file release_notes.md
          echo "릴리스 설명을 $f 로 채움"

  discord:
    # 설치 파일이 붙은 뒤 디스코드 고정 다운로드 임베드를 새 버전 링크로 고침
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: niniano/NiniTools
          sparse-checkout: .github/discord
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update pinned download embed
        env:
          DISCORD_DOWNLOAD_WEBHOOK: ${{ secrets.DISCORD_DOWNLOAD_WEBHOOK }}
          DOWNLOAD_MESSAGE_ID: ${{ vars.DOWNLOAD_MESSAGE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DISCORD_DOWNLOAD_WEBHOOK" ] || [ -z "$DOWNLOAD_MESSAGE_ID" ]; then
            echo "::notice::이 저장소에 DISCORD_DOWNLOAD_WEBHOOK · DOWNLOAD_MESSAGE_ID 가 없어 건너뜀 (NiniTools 4시간 주기 실행 때 반영)"
            exit 0
          fi
          python .github/discord/update_download_embed.py || echo "::warning::디스코드 임베드 고치기 실패 (NiniTools 4시간 주기 실행 때 반영)"
